<nav aria-label="Pagination" *ngIf="totalPages() > 1">
  <ul class="pagination justify-content-end mb-0">
    <li class="page-item" [class.disabled]="currentPage() === 1">
      <button class="page-link" (click)="goTo(currentPage() - 1)">
        <i class="bi bi-chevron-left"></i>
      </button>
    </li>

    <li class="page-item" *ngFor="let p of visiblePages()" [class.active]="p === currentPage()">
      <button class="page-link" (click)="goTo(p)">{{ p }}</button>
    </li>

    <li class="page-item" [class.disabled]="currentPage() === totalPages()">
      <button class="page-link" (click)="goTo(currentPage() + 1)">
        <i class="bi bi-chevron-right"></i>
      </button>
    </li>
  </ul>
</nav>

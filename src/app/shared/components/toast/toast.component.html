<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
  <div class="toast-item" [class]="'toast-item--' + toast.type" role="alert">
    <i class="bi" [class]="iconFor(toast.type)"></i>
    <span class="toast-item__message">{{ toast.message }}</span>
    <button type="button" class="toast-item__close" (click)="toastService.dismiss(toast.id)" aria-label="Close">
      <i class="bi bi-x"></i>
    </button>
  </div>
  }
</div>

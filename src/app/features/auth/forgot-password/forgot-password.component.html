<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <i class="bi bi-kanban-fill"></i>
      <span>CRM Dashboard</span>
    </div>

    @if (!sent()) {
    <h1 class="auth-card__title">Reset your password</h1>
    <p class="text-muted mb-3">Enter your email and we'll send you a reset link.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input id="email" type="email" class="form-control" formControlName="email"
          [class.is-invalid]="f.email.invalid && f.email.touched" placeholder="you@company.com" />
        @if (f.email.invalid && f.email.touched) {
        <div class="form-error">Enter a valid email address.</div>
        }
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
        @if (submitting()) {
        <span class="spinner-border spinner-border-sm me-2"></span> Sending...
        } @else {
        Send reset link
        }
      </button>
    </form>
    } @else {
    <div class="text-center">
      <i class="bi bi-envelope-check text-success" style="font-size: 2.5rem;"></i>
      <p class="mt-3">
        If an account exists for <strong>{{ f.email.value }}</strong>, a reset link is on its way.
      </p>
    </div>
    }

    <p class="auth-card__footer">
      <a routerLink="/auth/login"><i class="bi bi-arrow-left"></i> Back to sign in</a>
    </p>
  </div>
</div>
